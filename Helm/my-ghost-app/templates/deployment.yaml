apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: ghost
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ghost
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ghost
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: ghost
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 2368
          env:
            - name: NODE_ENV
              value: {{ .Values.nodeEnv | quote }}
            - name: url
              {{- if .Values.urlOverride }}
              value: {{ .Values.urlOverride | quote }}
              {{- else if .Values.prodUrlSchema }}
              value: {{ printf "http://%s" .Values.baseUrl | quote }}
              {{- else }}
              value: {{ printf "http://%s.non-prod.%s" .Values.datacenter .Values.baseUrl | quote }}
              {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
