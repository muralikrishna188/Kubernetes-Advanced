# Database: Secret + Deployment + internal ClusterIP Service
# (lab-only password; in production use Secret Manager / External Secrets)
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: ecom-app
type: Opaque
stringData:
  POSTGRES_PASSWORD: lab-only-change-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-db
  namespace: ecom-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database          # <-- target of the NetworkPolicy
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
      - name: db
        image: postgres:14-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: ecom
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: POSTGRES_PASSWORD
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sample-db-internal
  namespace: ecom-app
spec:
  type: ClusterIP
  selector:
    app: database
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
