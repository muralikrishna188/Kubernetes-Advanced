# NetworkPolicy: only catalog-api pods (same namespace) may reach the DB on 5432.
# Requires an enforcing CNI (GKE Dataplane V2 or Calico).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-catalog-to-db
  namespace: ecom-app
spec:
  podSelector:
    matchLabels:
      app: database            # 1. protect the database pods
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: catalog-api     # 2. only the catalog API (same namespace)
    ports:
    - protocol: TCP
      port: 5432               # 3. only on the Postgres port
