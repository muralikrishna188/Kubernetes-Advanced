# Role: read-only access to Pods, Pod logs and Services in the 'billing' namespace.
# No secrets, no write verbs, no other namespaces.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: billing
  name: auditor-read-only
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services"]
  verbs: ["get", "list", "watch"]
