# Catalog API Deployment + external LoadBalancer Service
# FIX: nginx listens on port 80, so containerPort/targetPort are 80 (was 8080).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-catalog-api
  namespace: ecom-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-api       # <-- allowed source in the NetworkPolicy
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
      - name: api
        image: nginx:1.27-alpine   # placeholder for the real API image
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sample-catalog-svc
  namespace: ecom-app
spec:
  type: LoadBalancer           # exposes the app externally (billable on GCP)
  selector:
    app: catalog-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
