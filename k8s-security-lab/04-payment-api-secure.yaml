# Payment API: compliant with the Pod Security Standard "restricted" profile.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-payment-api
  namespace: payment-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      automountServiceAccountToken: false
      # PSS restricted requires these at Pod level
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: payment-processor
        image: busybox:1.36        # placeholder image
        command: ["/bin/sh", "-c", "sleep 3600"]
        ports:
        - containerPort: 9090
        # PSS restricted requires these at Container level
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 64Mi
