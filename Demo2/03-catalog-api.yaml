# Catalog API Deployment and External Service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-catalog-api
  namespace: ecom-app
spec:
  selector:
    matchLabels:
      app: catalog-api # Source for Network Policy
  replicas: 2
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
      - name: api
        image: nginx:latest # Placeholder for the API container
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sample-catalog-svc
  namespace: ecom-app
spec:
  selector:
    app: catalog-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer # Exposes the application externally